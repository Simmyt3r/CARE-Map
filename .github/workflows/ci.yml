name: CI
on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Verify scheduled PostGIS risk and retention maintenance
        run: npx vitest run tests/risk-refresh.integration.test.ts
        env:
          CAREMAP_PG_INTEGRATION_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Verify geographic context and data-minimization using PostGIS
        run: npx vitest run tests/spatial-context.integration.test.ts
        env:
          CAREMAP_PG_INTEGRATION_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Verify statewide Sentinel tiling and quality-gated rollups
        run: npx vitest run tests/statewide-ndvi.integration.test.ts
        env:
          CAREMAP_PG_INTEGRATION_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run build
        env:
          SESSION_SECRET: ci-session-secret-that-is-longer-than-32-characters
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
