name: CI
on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SESSION_SECRET: ci-session-secret-that-is-longer-than-32-characters
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
